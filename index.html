
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>


<body class="min-h-screen bg-[#F8F4F0] text-[#1E1B4B]">

    <header class="bg-[#03080a] text-white px-8 py-4 shadow-lg">

        <div class="flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                + PLANIT <span class="text-purple-400">AI</span> 
            </h1>

            <nav class="flex items-center gap-6">

                <a href="index.html"
                   class="bg-[#c2f700] px-4 py-2 rounded-xl text-[#101820]">
                    Dashboard
                </a>

                <a href="new-project.html"
                   class="px-4 py-2 rounded-lg bg- hover:bg-[#c2f700]">
                    + New Project
                </a>

                <button class="px-4 py-2 rounded-lg hover:bg-[#c2f700]">
                    AI Settings
                </button>

            </nav>

        </div>

    </header>
    
    <main class="p-8">

        <section class="flex justify-between items-center mb-10">

            <div>
                <h2 class="text-3xl font-bold mb-2">
                    Welcome back!
                </h2>

                <p class="text-[#03080a]">
                    Manage your projects and track your progress.
                </p>
            </div>

            <a href="new-project.html"
               class="bg-[#1E1B4B] text-white px-5 py-3 rounded-lg hover:bg-[#03080a]">
                + New Project
            </a>

        </section>

        <!-- Statistics -->
        <section class="grid grid-cols-3 gap-6 mb-10">

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Total Projects</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Total Tasks</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <p class="text-gray-500">Completed Tasks</p>
                <h3 class="text-3xl font-bold mt-2">0</h3>
            </div>

        </section>

        <!-- Projects -->
        <section>

            <div class="flex justify-between items-center mb-6">

                <h2 class="text-2xl font-bold">
                    Your Projects
                </h2>

                <button class="text-purple-700 font-semibold">
                    View All →
                </button>

            </div>

            <div class="grid grid-cols-2 gap-6">

                <div class="bg-white p-6 rounded-xl shadow-sm">

                    <h3 class="text-xl font-bold mb-2">
                        E-commerce Website
                    </h3>

                    <p class="text-gray-500 mb-5">
                        Build an online shopping platform.
                    </p>

                    <div class="flex justify-between text-sm mb-2">
                        <span>8 / 12 tasks completed</span>
                        <span>67%</span>
                    </div>

                    <div class="w-full bg-purple-100 h-2 rounded-full">
                        <div class="bg-purple-600 h-2 w-[67%] rounded-full"></div>
                    </div>

                    <button class="bg-purple-700 text-white px-4 py-2 rounded-lg mt-5">
                        Open Board
                    </button>

                </div>

            </div>

        </section>

    </main>

</body>

</html>
