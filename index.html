
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#E2C2FF] text-[#1E1B4B]">

    <div class="flex min-h-screen">

        <aside class="w-full bg-[#2E1763] text-white p-6">

            <h1 class="text-2xl font-bold mb-12">
               + PLANIT <span class="text-purple-400">AI</span>
            </h1>

            <nav class="flex flex-col gap-4">

                <a href="index.html"
                   class="bg-purple-600 p-3 rounded-lg">
                    Dashboard
                </a>

                <a href="new-project.html"
                   class="p-3 rounded-lg hover:bg-purple-700">
                    + New Project
                </a>

                <button class="text-left p-3 rounded-lg hover:bg-purple-700">
                    AI Settings
                </button>

            </nav>

        </aside>

        <main class="flex-1 p-8">

            <section class="flex justify-between items-center mb-10">

                <div>
                    <h2 class="text-3xl font-bold mb-2">
                        Welcome back!
                    </h2>

                    <p class="text-purple-900">
                        Manage your projects and track your progress.
                    </p>
                </div>

                <a href="new-project.html"
                   class="bg-purple-700 text-white px-5 py-3 rounded-lg hover:bg-purple-800">
                    + New Project
                </a>

            </section>

            <!-- Statistics -->
            <section class="grid grid-cols-3 gap-6 mb-10">

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <p class="text-gray-500">Total Projects</p>
                    <h3 class="text-3xl font-bold mt-2">0</h3>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <p class="text-gray-500">Total Tasks</p>
                    <h3 class="text-3xl font-bold mt-2">0</h3>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <p class="text-gray-500">Completed Tasks</p>
                    <h3 class="text-3xl font-bold mt-2">0</h3>
                </div>

            </section>

            <!-- Projects -->
            <section>

                <div class="flex justify-between items-center mb-6">

                    <h2 class="text-2xl font-bold">
                        Your Projects
                    </h2>

                    <button class="text-purple-700 font-semibold">
                        View All →
                    </button>

                </div>

                <div class="grid grid-cols-2 gap-6">

                    <!-- Project Card -->
                    <div class="bg-white p-6 rounded-xl shadow-sm">

                        <h3 class="text-xl font-bold mb-2">
                            E-commerce Website
                        </h3>

                        <p class="text-gray-500 mb-5">
                            Build an online shopping platform.
                        </p>

                        <div class="flex justify-between text-sm mb-2">
                            <span>8 / 12 tasks completed</span>
                            <span>67%</span>
                        </div>

                        <div class="w-full bg-purple-100 h-2 rounded-full">
                            <div class="bg-purple-600 h-2 w-[67%] rounded-full"></div>
                        </div>

                        <button class="bg-purple-700 text-white px-4 py-2 rounded-lg mt-5">
                            Open Board
                        </button>

                    </div>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
