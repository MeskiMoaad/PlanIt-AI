
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLANIT AI | New Project</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-[#F8F4F0] text-[#1E1B4B]">

    <header class="bg-[#03080a] text-white px-8 py-4 shadow-lg">

        <div class="flex justify-between items-center">

            <h1 class="text-2xl font-bold">
                PLANIT <span class="text-purple-400">AI</span>
            </h1>

            <nav class="flex items-center gap-6">

                <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-[#c2f700]">
                    Dashboard
                </a>

                <a href="newProject.html" class="bg-[#c2f700] text-black px-4 py-2 rounded-xl">
                    + New Project
                </a>

                <button class="px-4 py-2 rounded-lg hover:bg-purple-700">
                    AI Settings
                </button>

            </nav>

        </div> 

    </header>

    <main class="w-full px-8 lg:px-16 py-10">

        <div class="mb-8">
            <h2 class="text-3xl font-bold mb-2">
                Create a New Project
            </h2>

            <p class="text-purple-950">
                Tell us about your project and let AI generate your development plan.
            </p>
        </div>

        <form class="bg-white p-8 lg:p-10 rounded-2xl shadow-lg space-y-8">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <div>
                    <label for="name" class="block font-semibold mb-2">
                        Project Name
                    </label>

                    <input type="text" id="name"
                        placeholder="Enter your project name"
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="description" class="block font-semibold mb-2">
                        Short Description
                    </label>

                    <input type="text" id="description"
                        placeholder="Describe your project briefly"
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">
                </div>

            </div>

            <div>
                <label for="brief" class="block font-semibold mb-2">
                    Project Brief
                </label>

                <textarea id="brief" rows="6"
                    placeholder="Explain your project requirements..."
                    class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600 resize-y"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <div>
                    <label for="duration" class="block font-semibold mb-2">
                        Duration (Days)
                    </label>

                    <input type="number" id="duration" min="1"
                        placeholder="Example: 10"
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="developers" class="block font-semibold mb-2">
                        Number of Developers
                    </label>

                    <input type="number" id="developers" min="1"
                        placeholder="Example: 3"
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">
                </div>

            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">

                <div>
                    <label for="technologies" class="block font-semibold mb-2">
                        Technologies
                    </label>

                    <input type="text" id="technologies"
                        placeholder="HTML, CSS, JavaScript..."
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">
                </div>

                <div>
                    <label for="difficulty" class="block font-semibold mb-2">
                        Difficulty Level
                    </label>

                    <select id="difficulty"
                        class="w-full border border-gray-300 rounded-lg p-4 outline-none focus:border-purple-600">

                        <option value="">Select difficulty</option>
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>

                    </select>
                </div>

            </div>

        
            <div class="flex justify-end pt-4">

                <button type="submit"
                    class="bg-blue-600 text-black font-semibold px-10 py-4 rounded-xl hover:bg-blue-700 transition">

                    Generate Development Plan →

                </button>
            </div>
        </form>

    </main>
    <script type="module" src="js/main.js"></script>

</body>
</html>
